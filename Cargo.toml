[package]
name = "mult"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal UI prototype for multiplexing AI agent workspaces, chats, and terminals."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jofr3/mult"

[workspace]
members = ["crates/protocol"]
default-members = [".", "crates/protocol"]

[profile.release]
# Smaller, faster shipped binaries. `panic = "unwind"` (the default) is kept on
# purpose: the client and daemon run cleanup/lock logic while unwinding, so
# `panic = "abort"` is intentionally NOT set here.
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
libc = "0.2"
mult-protocol = { path = "crates/protocol" }
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tui-term = { version = "0.3.4", default-features = false }
# Fork of vt100 0.15 with deep visible scrollback support; keep tui-term's
# vt100 feature disabled and render through the local adapter in src/ui.rs.
vt100 = { package = "fnug-vt100", version = "0.15.2" }

[dev-dependencies]
# Full-buffer render snapshots for the TUI (see `src/ui.rs` tests).
insta = "1"
