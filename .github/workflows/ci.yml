name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A new RustSec advisory is a change in the world, not in the repository, so
  # the supply-chain gate has to run without anyone pushing. Weekly, Monday
  # 05:17 UTC.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: just@1.57.0,cargo-deny@0.20.2
      # `just ci` is version-check, fmt-check, clippy -D warnings, tests and
      # cargo-deny. Its extension typecheck skips here (no node_modules) and is
      # run for real by the `extension` job below.
      - name: Run local CI gate
        run: just ci

      # S9: the `nix` job sets MULT_SKIP_PTY_INTEGRATION, so it reports 24
      # integration tests in 0.00 s — green with zero PTY coverage. Nothing
      # asserted that any job actually ran them. This step is that assertion:
      # MULT_REQUIRE_PTY_INTEGRATION makes a requested skip a hard failure, and
      # the sentinel is printed only after a real daemon has driven a real PTY,
      # so neither an accidental skip nor a `--skip` filter can pass here.
      - name: Prove the PTY integration tests ran
        shell: bash
        env:
          MULT_REQUIRE_PTY_INTEGRATION: "1"
        run: |
          set -euo pipefail
          cargo test --locked --test pty_integration -- --nocapture | tee integration.log
          grep -q 'MULT_PTY_INTEGRATION_RAN' integration.log
          grep -Eq 'test result: ok\. ([2-9][0-9]|[0-9]{3,}) passed' integration.log

  msrv:
    name: Rust 1.88 cargo check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `rust-toolchain.toml` pins 1.94 and a toolchain file outranks
      # `rustup default`, so a bare `cargo check` here would silently test the
      # pinned toolchain instead of the MSRV. `+1.88` outranks the file.
      - name: Check MSRV
        run: cargo +1.88 check --locked --workspace --all-targets --all-features

  coverage:
    name: Coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov@0.8.7
      # Reported, not gated beyond a floor well under the measured baseline
      # (82% lines at the time this job was added): coverage should inform
      # review, not block work that happens to touch a well-covered file.
      - name: Measure coverage
        run: cargo llvm-cov --locked --workspace --all-features --summary-only --fail-under-lines 75

  extension:
    name: Status extension typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: extensions
      - run: npm run typecheck
        working-directory: extensions

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: nix flake check
        run: nix flake check
