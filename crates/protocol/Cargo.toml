[package]
name = "mult-protocol"
# Inherited from `[workspace.package]` in the root `Cargo.toml` (H17): this used
# to be a fourth hand-maintained copy of the release version.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Wire protocol (postcard-framed messages) shared by the mult client and mult-server."
license.workspace = true
repository.workspace = true

[dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
