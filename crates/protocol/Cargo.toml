[package]
name = "mult-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Wire protocol (postcard-framed messages) shared by the mult client and mult-server."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jofr3/mult"

[dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
